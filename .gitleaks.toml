title = "Focus Contract Studio secret scanning"
minVersion = "8.30.0"

[extend]
useDefault = true

[[allowlists]]
description = "Revision 2 checklist phrases that describe token and API-shim tests, not credential values"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = [
  '''token negative matrix''',
  '''API shim''',
]
paths = ['''^docs/hackathon-build/checklist\.md$''']

[[allowlists]]
description = "Generated local build and dependency output is Git-ignored and is not publishable source"
paths = [
  '''^dist/''',
  '''^\.next/''',
  '''^\.vinext/''',
  '''^\.wrangler/''',
  '''^\.playwright-browsers/''',
  '''^node_modules/''',
]

[[allowlists]]
description = "Package 2 deterministic public HMAC test vector derived from bytes 0 through 31"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''expectedToken\s*=''']
paths = ['''^tests/package2-node/evidence-token\.test\.ts$''']
